input {
  # Completed files: EOF is a delimiter, so the last line needs no newline.
  file {
    id => "dropped_files"
    path => ["/logs/**/*"]
    exclude => [".gitkeep", "README*", "*.tmp", "*.partial", ".DS_Store"]
    mode => "read"
    exit_after_read => false
    sincedb_path => "/usr/share/logstash/data/files.sincedb"
    sincedb_write_interval => "1 second"
    sincedb_clean_after => 36500
    file_completed_action => "log"
    file_completed_log_path => "/usr/share/logstash/data/completed-files.log"
    check_archive_validity => true
    stat_interval => "1 second"
    discover_interval => 5
    ecs_compatibility => "v8"
    codec => plain { charset => "UTF-8" }
    add_field => { "[@metadata][lab_ingress]" => "file" }
  }
  # Files still being appended belong in live-logs/ and need newline delimiters.
  file {
    id => "live_files"
    path => ["/live-logs/**/*"]
    exclude => [".gitkeep", "README*", "*.tmp", "*.partial", ".DS_Store", "*.gz"]
    mode => "tail"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/tail.sincedb"
    sincedb_write_interval => "1 second"
    sincedb_clean_after => 36500
    stat_interval => "1 second"
    discover_interval => 5
    ecs_compatibility => "v8"
    add_field => { "[@metadata][lab_ingress]" => "file" }
  }
  # add_field appends to an existing value. A sender-supplied "file" marker
  # therefore cannot be mistaken for the exact file-input marker below.
  beats { port => 5044 ecs_compatibility => "v8" add_field => { "[@metadata][lab_ingress]" => "network" } }
  tcp { port => 5514 codec => line ecs_compatibility => "v8" add_field => { "[@metadata][lab_ingress]" => "network" } }
  udp { port => 5514 codec => plain ecs_compatibility => "v8" add_field => { "[@metadata][lab_ingress]" => "network" } }
}
filter {
  ruby { path => "/usr/share/logstash/config/normalize.rb" }
  ruby { path => "/usr/share/logstash/config/route.rb" }
  if [@metadata][source_timestamp] {
    date {
      match => ["[@metadata][source_timestamp]", "ISO8601"]
      target => "@timestamp"
      tag_on_failure => ["lab_timestamp_parse_failure"]
    }
  }
}
output {
  elasticsearch {
    hosts => ["https://elasticsearch:9200"]
    user => "logstash_internal"
    password => "${LOGSTASH_PASSWORD}"
    ssl_enabled => true
    ssl_certificate_authorities => ["/usr/share/logstash/config/certs/ca/ca.crt"]
    index => "%{[@metadata][lab_index_prefix]}-%{+yyyy.MM.dd}"
    pipeline => "lab-ingest"
    manage_template => false
    ilm_enabled => false
    data_stream => false
    action => "index"
  }
}
