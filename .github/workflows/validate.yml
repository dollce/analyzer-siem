name: Validate IaC
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: gem install minitest --no-document
      - run: python3 builder.py --no-version-check check
      - run: bash scripts/check_logstash.sh
      # Intentionally no lab startup, input logs, or deployment in CI.
